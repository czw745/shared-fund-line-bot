name = "shared-fund-line-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "shared-fund-ledger"
database_id = "afcaacdc-63b4-43cf-b67e-02c055cc0637"
